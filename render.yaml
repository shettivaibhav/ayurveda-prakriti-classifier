services:
  - type: web
    name: prakriti-backend-api
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN
        value: "*"
